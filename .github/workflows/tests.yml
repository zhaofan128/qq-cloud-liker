name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python main.py all --dry-run
        env:
          QQ_UIN: "10000"
          QQ_FRIENDS: "10001,10002"
          QQ_DRY_RUN: "1"
