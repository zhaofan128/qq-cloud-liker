name: 构建安卓安装包

# 手动触发，或在 android/ 目录变更时自动构建
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          test -n "$SM" || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes | "$SM" --licenses > /tmp/lic.log 2>&1 || true
          yes | "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /tmp/sdk.log 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/qqliker.jks"
          ls -lh "$RUNNER_TEMP/qqliker.jks"

      - name: 编译 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/qqliker.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/Qzan.apk
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Qzan-apk
          path: out/Qzan.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Q赞 安卓安装包
          body: |
            下载 `Qzan.apk` 直接安装即可（首次安装需允许「未知来源应用」）。

            安装包使用固定签名，后续版本可直接覆盖升级。
          files: out/Qzan.apk
          make_latest: false
