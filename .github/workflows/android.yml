name: 构建安卓安装包

# 手动触发，或在 android/ 目录变更时自动构建
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          test -n "$SM" || { echo "::error::找不到 sdkmanager"; exit 1; }
          # 无人值守接受全部许可
          yes | "$SM" --licenses > /tmp/lic.log 2>&1 || true
          tail -3 /tmp/lic.log || true
          yes | "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /tmp/sdk.log 2>&1 || true
          tail -5 /tmp/sdk.log || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/Qzan.apk
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Qzan-apk
          path: out/Qzan.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Q赞 安卓安装包
          body: |
            下载 `Qzan.apk` 直接安装即可（首次安装需允许「未知来源应用」）。
          files: out/Qzan.apk
          make_latest: false
