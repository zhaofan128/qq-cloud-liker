name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:napcat ./deploy
          docker push ghcr.io/${{ github.repository }}:napcat
