name: 每日名片赞（每人 10 个）

# ⚠️ GitHub Actions 的 cron 用的是 UTC 时间。
#    北京时间 10:00  =  UTC 02:00
#    北京时间 10:00 对应 UTC+8，中国没有夏令时，全年固定。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      times:
        description: "每位好友点赞次数"
        required: false
        default: "10"
      dry_run:
        description: "仅演练不真的点赞（1=开启）"
        required: false
        default: "0"

# 同一时间只跑一份，避免重叠执行
concurrency:
  group: qq-card-like
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  card-like:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行名片赞任务
        env:
          QQ_UIN: ${{ secrets.QQ_UIN }}
          QQ_COOKIE: ${{ secrets.QQ_COOKIE }}
          QQ_FRIENDS: ${{ vars.QQ_FRIENDS }}
          QQ_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          echo "开始时间: $(TZ=Asia/Shanghai date '+%F %T %Z')"
          if [ -n "${{ github.event.inputs.times }}" ]; then
            python main.py card-like --times "${{ github.event.inputs.times }}" --max-friends 0
          else
            # 不传 --times 时读取 config/control.json（App 里改的次数）
            python main.py card-like --max-friends 0
          fi

      - name: 更新快照（好友 / 动态 / 执行记录）
        if: always()
        continue-on-error: true
        env:
          QQ_UIN: ${{ secrets.QQ_UIN }}
          QQ_COOKIE: ${{ secrets.QQ_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py sync || true
          mkdir -p docs/data
          cp data/snapshot.json docs/data/snapshot.json

      - name: 提交快照
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json docs/data/snapshot.json config/control.json || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 名片赞后同步快照 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
            git push
          fi

      - name: 失败时提示
        if: failure()
        run: |
          echo "::error::名片赞任务失败，通常是 Cookie 过期。请重新抓取 Cookie 并更新 Secret QQ_COOKIE。"
