name: daily-card-like

# 每天 10:00（北京时间）给全部好友点满名片赞，点完就退出
# GitHub 的 cron 用 UTC：北京 10:00 = UTC 02:00
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-card-like
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 恢复登录态
        uses: actions/cache/restore@v4
        with:
          path: qqdata
          key: qq-login-${{ github.run_id }}
          restore-keys: |
            qq-login-

      - name: 启动协议端
        run: |
          for REG in docker.1ms.run docker.m.daocloud.io dockerpull.org docker.io; do
            echo "== 尝试 $REG"
            if docker pull "$REG/mlikiowa/napcat-docker:latest"; then
              docker tag "$REG/mlikiowa/napcat-docker:latest" mlikiowa/napcat-docker:latest
              echo "IMAGE_OK: $REG"
              break
            fi
          done
          docker image inspect mlikiowa/napcat-docker:latest >/dev/null || exit 1
          mkdir -p qqdata/napcat qqdata/QQ
          sudo chown -R $(id -u):$(id -g) qqdata || true
          docker run -d --name napcat --shm-size=1g --cap-add=SYS_ADMIN \
            -e NAPCAT_UID=$(id -u) -e NAPCAT_GID=$(id -g) \
            -e TZ=Asia/Shanghai \
            -v "$PWD/qqdata/napcat:/app/napcat" \
            -v "$PWD/qqdata/QQ:/app/.config/QQ" \
            -p 3000:3000 \
            mlikiowa/napcat-docker:latest
          sleep 30
          docker logs napcat 2>&1 | tail -15

      - name: 等快速登录
        id: login
        run: |
          OK=0
          for i in $(seq 1 18); do
            RESP=$(curl -s -m 4 -X POST http://127.0.0.1:3000/get_login_info \
                   -H 'Content-Type: application/json' -d '{}' || true)
            if echo "$RESP" | grep -q '"user_id"'; then
              echo "已登录：$RESP"
              OK=1
              break
            fi
            if [ "$i" = "1" ] || [ "$i" = "6" ]; then
              docker cp napcat:/app/napcat/cache/qrcode.png ./qrcode.png 2>/dev/null || true
            fi
            sleep 20
          done
          if [ "$OK" = "1" ]; then
            echo "ok=1" >> $GITHUB_OUTPUT
          else
            echo "ok=0" >> $GITHUB_OUTPUT
            echo "::warning::这次没能免扫码登录，需要重跑 napcat-login 拿新二维码"
          fi

      - name: 点赞
        id: like
        if: steps.login.outputs.ok == '1'
        env:
          ONEBOT_API: http://127.0.0.1:3000
          LIKE_TIMES: "10"
          LIKE_GAP: "1.2"
          RUNS_PATH: ${{ github.workspace }}/runs.json
          LOG_PATH: ${{ github.workspace }}/like.log
        run: |
          python3 deploy/dailylike.py --once
          echo "---- 末尾日志 ----"
          tail -12 like.log || true

      - name: 写日志并提交
        if: always()
        env:
          RESULT: ${{ steps.like.outcome }}
        run: |
          git config user.name "qqliker-bot"
          git config user.email "qqliker-bot@users.noreply.github.com"
          DATE=$(TZ=Asia/Shanghai date +%F)
          mkdir -p logs data

          if [ -f runs.json ]; then
            cp runs.json data/runs.json
          fi

          if [ -f like.log ]; then
            cp like.log "logs/${DATE}.log"
          fi

          OK=$(python3 -c "
          import json,sys
          try:
              d=json.load(open('runs.json'))
              print(d[-1]['ok'] if d else 0)
          except Exception:
              print(0)
          ")

          {
            echo "# ${DATE} 名片赞"
            echo ""
            echo "- 运行结果：${RESULT}"
            echo "- 成功好友：${OK}"
            echo "- 详细：logs/${DATE}.log"
          } > "logs/${DATE}.md"

          rm -f ./qrcode.png
          git add -A logs data
          git commit -q -m "chore: ${DATE} 名片赞执行记录（${OK} 位好友）" || echo "没有变化"
          git pull --rebase -q || true
          git push -q || echo "push 失败"

      - name: 保存登录态
        if: steps.login.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: qqdata
          key: qq-login-${{ github.run_id }}

      - name: 收尾
        if: always()
        run: docker logs napcat 2>&1 | tail -25 || true
