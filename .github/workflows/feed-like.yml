name: 空间动态秒赞（每 5 分钟）

# GitHub Actions 的最小调度间隔就是 5 分钟，且高峰期会有 3~15 分钟延迟。
# 想要"发出来 1 分钟内就赞"，请改用 worker/ 目录里的 Cloudflare Worker 版本（每分钟）。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: qq-feed-like
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed-like:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 扫描并点赞新动态
        env:
          QQ_UIN: ${{ secrets.QQ_UIN }}
          QQ_COOKIE: ${{ secrets.QQ_COOKIE }}
        run: |
          # 逐个好友扫最新说说，只赞最近 8 分钟内的（5 分钟一轮，基本不重复）
          python main.py feed-like --num 2 --since 8 --max-like 20
