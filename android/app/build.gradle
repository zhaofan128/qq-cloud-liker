plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qqliker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.qqliker.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // 免登录调试签名，直接可安装
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
